name: Prueba histórica de señales y rangos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'   # cada domingo a las 5 h (España, invierno)

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backtest con el historial completo de cada activo
        run: node scripts/backtest.mjs
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          [ -f data/backtest.json ] || exit 0
          git add data/backtest.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Backtest $(date -u +%F)"
          git pull --rebase origin main
          git push
