name: Comprobar datos reales

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7,11,15,19 * * *'   # 4 veces al día (8, 12, 16 y 20 h en España en invierno)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Comprobar cada activo
        run: node scripts/check_live.mjs
