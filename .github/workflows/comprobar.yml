name: Comprobar datos reales

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'   # cada día a las 8 h (España, invierno): noticias, SEC y sentimiento. Los precios los comprueba la app.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Comprobar cada activo
        run: node scripts/check_live.mjs
