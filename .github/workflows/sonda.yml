name: Sonda de datos (manual)
on:
  workflow_dispatch:
    inputs:
      syms:
        description: 'Símbolos Nasdaq (SYM:clase, separados por comas)'
        default: 'CPER:etf,COPX:etf'
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sonda.mjs
        env:
          SYMS: ${{ inputs.syms }}
