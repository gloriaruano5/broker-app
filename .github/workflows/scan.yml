name: Revisión del mercado (S&P 500 y Nasdaq 100)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * 1-5'   # de lunes a viernes, tras el cierre de EE. UU.

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar el mercado
        timeout-minutes: 40
        run: node scripts/scan.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/scan.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Revisión del mercado $(date -u +%F)"
          git pull --rebase origin main
          git push
