name: Compilar APK

on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk MiCartera.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiCartera-apk
          path: MiCartera.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mi Cartera 1.0.${{ github.run_number }}
          body: Descarga MiCartera.apk en el móvil e instálalo. Se instala encima de la versión anterior sin perder tus datos.
          files: MiCartera.apk
          make_latest: true
