name: Sonda Yahoo (manual)
on:
  workflow_dispatch:
    inputs:
      q:
        description: 'símbolo,rango,intervalo'
        default: 'PPFB.DE,max,1mo'
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sonda-yahoo.mjs
        env:
          Q: ${{ inputs.q }}
