name: Diario de señales

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'   # cada día a las 23:30 (España, invierno), con la bolsa de EE. UU. ya cerrada

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardar la foto del día
        run: node scripts/diario.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/diario
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Diario $(date -u +%F)"
          git pull --rebase origin main
          git push
